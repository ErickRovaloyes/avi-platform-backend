name: Deploy Backend

on:
  push:
    branches: [main]
  # Permite relanzar el despliegue a mano desde la pestana Actions, sin tener que
  # inventar un commit. Hizo falta durante la caida de Actions del 2026-08-06.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Connection timeout subido a 120s: el VPS puede tardar en aceptar SSH
          # cuando está ocupado construyendo (evita "dial tcp :22: i/o timeout").
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            cd /opt/avi-platform/backend
            # `git pull` actualiza refs/remotes/origin/main, y si dos despliegues coinciden el
            # segundo falla con "cannot lock ref" aunque el repositorio ya esté al día.
            # fetch + reset --hard FETCH_HEAD no toca esa ref y es idempotente: deja el árbol
            # exactamente en el commit remoto, que es justo lo que quiere un destino de despliegue.
            git fetch --prune origin main
            git reset --hard FETCH_HEAD
            cd /opt/avi-platform
            docker compose build avi-backend
            
            # Compose RENOMBRA el contenedor viejo antes de borrarlo y esa operación a veces se
            # pierde ("No such container: <hash>_avi-backend"). Cuando pasa, up aborta y el servicio
            # se queda SIN contenedor: el sitio devuelve 404 y el despliegue salía en VERDE.
            # Momento en que empieza el despliegue: sirve para distinguir el contenedor NUEVO
            # del que ya estaba.
            INICIO=$(date -u +%s)

            # Que esté arriba NO basta. El 2026-08-19 el `up` abortó por un conflicto de nombres
            # con otro servicio, el contenedor de hacía 7 horas siguió corriendo, esta función lo
            # dio por bueno y el despliegue salió en verde sirviendo la versión anterior. Así que
            # además se exige que se haya arrancado durante ESTE despliegue.
            arriba() {
              cid=$(docker compose ps -q avi-backend 2>/dev/null)
              [ -n "$cid" ] || return 1
              [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null)" = "true" ] || return 1
              arrancado=$(docker inspect -f '{{.State.StartedAt}}' "$cid" 2>/dev/null)
              epoca=$(date -u -d "$arrancado" +%s 2>/dev/null) || return 0   # sin `date -d`, no se bloquea
              [ "$epoca" -ge "$INICIO" ]
            }
            
            docker compose up -d --no-deps --force-recreate avi-backend || true
            for i in 1 2 3; do
              arriba && break
              echo "[deploy] avi-backend no quedó arriba; limpiando restos y reintentando ($i/3)…"
              docker ps -a --filter "name=_avi-backend" -q | xargs -r docker rm -f || true
              docker compose up -d --no-deps --force-recreate avi-backend || true
              sleep 4
            done
            
            # Un verde con el servicio caído es peor que un rojo: si no arrancó, el paso FALLA.
            if ! arriba; then
              echo "[deploy] ERROR: avi-backend no está en ejecución tras 3 intentos"
              docker compose ps
              docker compose logs --tail 40 avi-backend || true
              exit 1
            fi
            docker compose ps avi-backend
            echo "[deploy] avi-backend en ejecución OK"
